name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m ruff format --check .
      - run: make doctor
      - run: make check
      - run: make smoke-offline

  # Report only: dependency CVEs are visible in the log, a finding never fails the build.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: pip-audit --desc --progress-spinner off
